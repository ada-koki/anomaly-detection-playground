[project]
name = "anomaly-detection-playground"
version = "0.1.0"
description = "産業用画像異常検知のCPU優先ベンチマーク"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anomalib[cpu]==2.7.0",
    "psutil>=5.9,<8",
    "scikit-learn>=1.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["adbench"]
